# Hyprland config for sebaz07/My_ArchLinux_Racing
# Portable laptop profile; monitor layout is detected automatically.

$terminal = ghostty +new-window
$fileManager = thunar
$menu = wofi --show drun
$mainMod = SUPER

monitor = ,preferred,auto,1
source = ~/.config/hypr/theme.conf
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true

# Keep the Qylock Pixel Dusk City video theme for the lock screen.
exec-once = ~/.config/hypr/scripts/theme-switcher.sh --current
exec-once = hypridle
exec-once = mako
exec-once = nm-applet --indicator
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
bind = $mainMod, T, exec, ~/.config/hypr/scripts/theme-switcher.sh

# Wayland and cursor defaults
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland

input {
    kb_layout = latam
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
        tap-to-click = true
    }
}

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(f2f2f2ff) rgba(888888ff) 45deg
    col.inactive_border = rgba(45475aaa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 0.84
    inactive_opacity = 0.76
    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(11111bee)
    }
    blur {
        enabled = true
        size = 5
        passes = 2
        vibrancy = 0.15
    }
}

animations {
    enabled = true
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    animation = windows,1,5,easeOutQuint,popin 85%
    animation = windowsOut,1,4,easeOutQuint,popin 85%
    animation = border,1,7,easeOutQuint
    animation = fade,1,5,easeOutQuint
    animation = workspaces,1,5,easeInOutCubic,slide
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# Core controls
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive
bind = SUPER, W, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, exec, $menu
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, L, exec, ~/.local/share/quickshell-lockscreen/lock.sh
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = , Print, exec, grim - | wl-copy

# Focus and move windows
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Laptop brightness and audio keys
bindel = ,XF86AudioRaiseVolume,exec,wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume,exec,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = ,XF86AudioMute,exec,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86MonBrightnessUp,exec,brightnessctl set 5%+
bindel = ,XF86MonBrightnessDown,exec,brightnessctl set 5%-
